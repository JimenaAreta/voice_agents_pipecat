[project]
name = "voice-agents-pipecat"
version = "0.1.0"
description = "Bot de voz para pedidos de restaurante en una formación de Pipecat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.0",
    "loguru>=0.7.3",
    "pipecat-ai[daily,deepgram,elevenlabs,openai,runner,silero,webrtc,websocket]~=1.12.0",
    "pydantic>=2.10,<3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "evals"]
asyncio_mode = "auto"
